<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nature's Platter</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Font Sora -->
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- <h2>Nature's Platter</h2> -->
    <header>
      <nav
        class="grid grid-cols-3 items-center justify-center bg-amber-50 container mx-auto pt-5"
      >
        <img src="assets/nav-logo.png" alt="Navbar Logo" />

        <ul class="flex gap-4">
          <li>Products</li>
          <li>Services</li>
          <li>Contact us</li>
        </ul>

        <div class="flex gap-4">
          <span><i class="fa-solid fa-magnifying-glass"></i></span>
          <span><i class="fa-solid fa-cart-shopping"></i></span>
          <button
            class="rounded-2xl border border-green-400 font-semibold px-3 py-1"
          >
            Login
          </button>
          <button
            class="rounded-2xl bg-green-400 text-white font-semibold px-3 py-1"
          >
            Register
          </button>
        </div>
      </nav>

      <section class="flex flex-col items-center justify-center text-center">
        <h2 class="text-6xl font-bold">
          Freshness <span class="text-green-500">You Can<br />Count</span> On,
          Prices You’ll Love!
        </h2>

        <p class="mt-4 max-w-2xl">
          Shop your daily essentials at unbeatable prices. From fresh produce to
          pantry staples, we’ve got you covered every day!
        </p>

        <img src="assets/Hero Section 1.png" alt="Big Basket" class="mt-6" />
      </section>
    </header>
  </body>
</html>
